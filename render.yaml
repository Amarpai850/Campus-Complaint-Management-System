services:
  - type: web
    name: campus-complaint-management
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        value: campus_complaints
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: STAFF_INITIAL_PASSWORD
        sync: false
