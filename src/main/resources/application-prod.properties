# ===================================================================
# PRODUCTION PROFILE CONFIGURATION (SPRING_PROFILES_ACTIVE=prod)
# ===================================================================

# Hibernate non-destructive schema management
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Production template caching for performance
spring.thymeleaf.cache=true

# Security & Error Handling: Do not leak internal stack traces
server.error.include-stacktrace=never
server.error.include-message=always

# Production Logging
logging.level.root=INFO
logging.level.com.campus.complaint=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
