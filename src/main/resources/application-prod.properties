# ===================================================================
# PRODUCTION PROFILE CONFIGURATION (SPRING_PROFILES_ACTIVE=prod)
# Configured for TiDB Cloud Serverless / Cloud MySQL 8.0
# ===================================================================

# Database: Constructed strictly from DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:4000}/${DB_NAME:campus_complaints}?sslMode=VERIFY_IDENTITY&useSSL=true&enabledTLSProtocols=TLSv1.2,TLSv1.3&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP) tuned for Cloud Serverless MySQL / TiDB
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=30000

# Hibernate non-destructive schema management
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Production template caching for performance
spring.thymeleaf.cache=true

# Security & Error Handling: Do not leak internal stack traces
server.error.include-stacktrace=never
server.error.include-message=always

# Production Logging
logging.level.root=INFO
logging.level.com.campus.complaint=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
