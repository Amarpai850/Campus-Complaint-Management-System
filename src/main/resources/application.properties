# ===================================================================
# BASE APPLICATION CONFIGURATION
# ===================================================================

spring.application.name=Campus Complaint Management System
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ===================================================================
# SERVER (Dynamic cloud port binding via $PORT, defaults to 8080)
# ===================================================================
server.port=${PORT:8080}

# ===================================================================
# DATABASE CONFIGURATION (Supports full DB_URL or individual host/port/name)
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:campus_complaints}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===================================================================
# JPA / HIBERNATE
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ===================================================================
# THYMELEAF
# ===================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ===================================================================
# LOGGING
# ===================================================================
logging.level.root=INFO
logging.level.com.campus.complaint=INFO
logging.level.org.springframework.security=INFO
