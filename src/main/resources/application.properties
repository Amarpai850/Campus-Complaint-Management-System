# ========================
# APPLICATION CONFIGURATION
# ========================

spring.application.name=Campus Complaint Management System

# ========================
# SERVER
# ========================
server.port=8080

# ========================
# DATABASE (MySQL)
# ========================
spring.datasource.url=jdbc:mysql://localhost:3306/campus_complaints?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================
# JPA / HIBERNATE
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ========================
# THYMELEAF
# ========================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ========================
# LOGGING
# ========================
logging.level.root=INFO
logging.level.com.campus.complaint=DEBUG
logging.level.org.springframework.security=INFO
