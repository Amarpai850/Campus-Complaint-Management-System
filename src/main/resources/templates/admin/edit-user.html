<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User - Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar">
    <div class="container">
        <a href="/admin/dashboard" class="brand">🏫 Campus CMS (Admin)</a>
        <div class="nav-links">
            <a th:href="@{/admin/dashboard}">Complaints</a>
            <a th:href="@{/admin/users}">Users</a>
            <a th:href="@{/admin/categories}">Categories</a>
            <form th:action="@{/logout}" method="post" style="display:inline;"><button type="submit">Logout</button></form>
        </div>
    </div>
</nav>

<div class="container main-content">
    <div class="page-header">
        <h1>✏️ Edit User</h1>
        <a th:href="@{/admin/users}" class="btn btn-secondary">← Back to Users</a>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card">
        <p><strong>Role:</strong> <span th:text="${user.role}"></span> <span class="text-muted">(role cannot be changed here)</span></p>

        <form th:action="@{/admin/users/{id}/edit(id=${user.id})}" th:object="${userForm}" method="post">
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" th:field="*{fullName}" required maxlength="100">
            </div>

            <div class="form-group">
                <label>Username *</label>
                <input type="text" th:field="*{username}" required minlength="3" maxlength="50">
            </div>

            <div class="form-group">
                <label>Email *</label>
                <input type="email" th:field="*{email}" required maxlength="100">
            </div>

            <div class="form-group">
                <label>Phone</label>
                <input type="text" th:field="*{phone}" maxlength="15">
            </div>

            <div class="form-group">
                <label>Department</label>
                <input type="text" th:field="*{department}" maxlength="100">
            </div>

            <div class="form-group">
                <label>New Password (optional)</label>
                <input type="password" th:field="*{password}" minlength="6" maxlength="100" placeholder="Leave blank to keep current password">
            </div>

            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a th:href="@{/admin/users}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>

<footer class="footer">
    <p>© 2026 Campus Complaint Management System - Admin Portal</p>
</footer>
</body>
</html>
