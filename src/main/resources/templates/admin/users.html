<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar">
    <div class="container">
        <a href="/admin/dashboard" class="brand">🏫 Campus CMS (Admin)</a>
        <div class="nav-links">
            <a th:href="@{/admin/dashboard}">Complaints</a>
            <a th:href="@{/admin/users}">Users</a>
            <a th:href="@{/admin/categories}">Categories</a>
            <form th:action="@{/logout}" method="post" style="display:inline;"><button type="submit">Logout</button></form>
        </div>
    </div>
</nav>

<div class="container main-content">
    <div class="page-header">
        <h1>👥 Registered System Users</h1>
        <a th:href="@{/admin/dashboard}" class="btn btn-secondary">← Back to Dashboard</a>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Full Name</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Department</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Registered On</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${users}">
                        <td th:text="${u.id}"></td>
                        <td th:text="${u.fullName}"></td>
                        <td th:text="${u.username}"></td>
                        <td th:text="${u.email}"></td>
                        <td th:text="${u.phone != null ? u.phone : '-'}"></td>
                        <td th:text="${u.department != null ? u.department : '-'}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${u.role.name() == 'ADMIN' ? 'badge-in-progress' :
                                                   u.role.name() == 'MAINTENANCE_STAFF' ? 'badge-assigned' : 'badge-pending'}"
                                  th:text="${u.role}"></span>
                        </td>
                        <td>
                            <span th:text="${u.enabled ? 'Active' : 'Disabled'}"
                                  th:style="${u.enabled ? 'color:green; font-weight:600;' : 'color:red; font-weight:600;'}"></span>
                        </td>
                        <td th:text="${#temporals.format(u.createdAt, 'dd-MM-yyyy HH:mm')}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<footer class="footer">
    <p>© 2026 Campus Complaint Management System - Admin Portal</p>
</footer>
</body>
</html>
