<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Campus Complaint Management</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <h2>📝 Create Account</h2>
        <p class="subtitle">Register as a new student</p>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form th:action="@{/register}" th:object="${registerRequest}" method="post">
            <div class="form-group">
                <label for="fullName">Full Name *</label>
                <input type="text" id="fullName" th:field="*{fullName}" class="form-control"
                       placeholder="Enter your full name" required>
                <small th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" style="color:red;"></small>
            </div>
            <div class="form-group">
                <label for="username">Username *</label>
                <input type="text" id="username" th:field="*{username}" class="form-control"
                       placeholder="Choose a username" required>
                <small th:if="${#fields.hasErrors('username')}" th:errors="*{username}" style="color:red;"></small>
            </div>
            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" th:field="*{email}" class="form-control"
                       placeholder="Enter your email" required>
                <small th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:red;"></small>
            </div>
            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" th:field="*{password}" class="form-control"
                       placeholder="Minimum 6 characters" required>
                <small th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color:red;"></small>
            </div>
            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="text" id="phone" th:field="*{phone}" class="form-control"
                       placeholder="Phone number (optional)">
            </div>
            <div class="form-group">
                <label for="department">Department</label>
                <input type="text" id="department" th:field="*{department}" class="form-control"
                       placeholder="e.g. Computer Science">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Register</button>
        </form>

        <p class="text-center mt-4">
            Already have an account? <a th:href="@{/login}">Login here</a>
        </p>
    </div>
</div>
</body>
</html>
