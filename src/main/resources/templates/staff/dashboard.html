<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard - Campus CMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar">
    <div class="container">
        <a href="/staff/dashboard" class="brand">🔧 Campus CMS (Staff Portal)</a>
        <div class="nav-links">
            <a th:href="@{/staff/dashboard}">My Tasks</a>
            <span th:text="'👷 ' + ${username}" style="color:white;"></span>
            <form th:action="@{/logout}" method="post" style="display:inline;"><button type="submit">Logout</button></form>
        </div>
    </div>
</nav>

<div class="container main-content">
    <div class="page-header">
        <h1>🛠️ Maintenance Assignments</h1>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div th:if="${#lists.isEmpty(complaints)}" class="card text-center">
        <p class="text-muted">You currently have no complaints assigned to you. Great job!</p>
    </div>

    <div th:unless="${#lists.isEmpty(complaints)}" class="table-responsive card">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Category</th>
                    <th>Location</th>
                    <th>Priority</th>
                    <th>Status</th>
                    <th>Assigned Date</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="c : ${complaints}">
                    <td th:text="${c.id}"></td>
                    <td th:text="${c.title}"></td>
                    <td th:text="${c.categoryName != null ? c.categoryName : '-'}"></td>
                    <td th:text="${c.location}"></td>
                    <td>
                        <span th:text="${c.priority}"
                              th:style="${c.priority == 'URGENT' || c.priority == 'HIGH' ? 'color:red; font-weight:bold;' : 'color:inherit;'}"></span>
                    </td>
                    <td>
                        <span class="badge"
                              th:classappend="${c.status.name() == 'PENDING' ? 'badge-pending' :
                                               c.status.name() == 'ASSIGNED' ? 'badge-assigned' :
                                               c.status.name() == 'IN_PROGRESS' ? 'badge-in-progress' :
                                               c.status.name() == 'RESOLVED' ? 'badge-resolved' : 'badge-closed'}"
                              th:text="${c.status}"></span>
                    </td>
                    <td th:text="${#temporals.format(c.updatedAt != null ? c.updatedAt : c.createdAt, 'dd-MM-yyyy HH:mm')}"></td>
                    <td>
                        <a th:href="@{/staff/complaints/{id}(id=${c.id})}" class="btn btn-sm btn-primary">Work on Task</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<footer class="footer">
    <p>© 2026 Campus Complaint Management System - Staff Portal</p>
</footer>
</body>
</html>
