<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Complaint - Campus CMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar">
    <div class="container">
        <a href="/student/dashboard" class="brand">🏫 Campus CMS</a>
        <div class="nav-links">
            <a th:href="@{/student/dashboard}">Dashboard</a>
            <a th:href="@{/student/complaints/new}">New Complaint</a>
            <form th:action="@{/logout}" method="post" style="display:inline;"><button type="submit">Logout</button></form>
        </div>
    </div>
</nav>

<div class="container main-content">
    <div class="page-header">
        <h1>📝 Submit New Complaint</h1>
        <a th:href="@{/student/dashboard}" class="btn btn-secondary">← Back</a>
    </div>

    <div class="card">
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form th:action="@{/student/complaints/new}" th:object="${complaintRequest}" method="post">
            <div class="form-group">
                <label for="title">Title *</label>
                <input type="text" id="title" th:field="*{title}" class="form-control"
                       placeholder="Brief title of your complaint" required>
                <small th:if="${#fields.hasErrors('title')}" th:errors="*{title}" style="color:red;"></small>
            </div>

            <div class="form-group">
                <label for="categoryId">Category *</label>
                <select id="categoryId" th:field="*{categoryId}" class="form-control" required>
                    <option value="">-- Select Category --</option>
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                </select>
                <small th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}" style="color:red;"></small>
            </div>

            <div class="form-group">
                <label for="location">Location *</label>
                <input type="text" id="location" th:field="*{location}" class="form-control"
                       placeholder="e.g. Block A, Room 201" required>
                <small th:if="${#fields.hasErrors('location')}" th:errors="*{location}" style="color:red;"></small>
            </div>

            <div class="form-group">
                <label for="priority">Priority</label>
                <select id="priority" th:field="*{priority}" class="form-control">
                    <option value="LOW">Low</option>
                    <option value="MEDIUM" selected>Medium</option>
                    <option value="HIGH">High</option>
                    <option value="URGENT">Urgent</option>
                </select>
            </div>

            <div class="form-group">
                <label for="description">Description *</label>
                <textarea id="description" th:field="*{description}" class="form-control"
                          placeholder="Describe the issue in detail..." rows="5" required></textarea>
                <small th:if="${#fields.hasErrors('description')}" th:errors="*{description}" style="color:red;"></small>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Submit Complaint</button>
        </form>
    </div>
</div>

<footer class="footer">
    <p>© 2026 Campus Complaint Management System</p>
</footer>
</body>
</html>
